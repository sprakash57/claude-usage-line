name: Download count

on:
  schedule:
    - cron: "0 3 */2 * *" # 03:00 UTC every second day
  workflow_dispatch:

permissions:
  contents: write

concurrency: downloads

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Record clones and update README
        env:
          # GITHUB_TOKEN can't read traffic; needs a PAT with Administration: read on this repo
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: node .github/scripts/clones.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/clones.json
          git diff --cached --quiet || git commit -m "chore: update download count [skip ci]"
          git push
